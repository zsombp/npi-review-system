    <!-- 2026-09-26 (layout audit, docs/reviews/LAYOUT-AUDIT-APP-2026-09-26.md): viewport-fit=cover.
         Without it iOS reports no safe area, so the env(safe-area-inset-*) the tab bar and the undo
         bar already asked for were zero; with it the page runs to the screen's edges and every bar,
         gutter and floating card keeps its content out of the notch and off the home indicator
         (styles.css --sa-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

         "review intelligence" is on the copy guide's banned list and the page is now
         declared Hungarian. Changing it is a copy change, not a design one. -->

    <!-- Both modes are real modes, so the browser is told before the first paint. -->
    <meta name="color-scheme" content="light dark" />
    <!--
      The two files a first screen is set in: the display face for the page title and
      the figures, the text face for everything else. 74.7 KB together, self-hosted, no
      third party. The two -lat-ext twins are deliberately not preloaded: they are
      fetched the moment the page sets its first ő or ű, which on a Hungarian page is
      immediately, and preloading them would cost the first paint 39.6 KB it does not
      need on an English one. The italics are never on a first screen at all; the brand
      allows italic only inside a quoted review.
      crossorigin is required even for a same-origin font preload, or the browser
      fetches the file twice.
    -->
    <!-- 2026-09-21: the display face is no longer preloaded. Which one a page needs
         depends on the person's style and font (lib/appearance.ts), and preloading one of
         fourteen faces would cost everybody else a file they never paint with. -->

    <!-- 2026-10-16 (FOUNDATION, D-069; GAPS move 11, CRIT-FLOW-006): a Pop splash instead of the boot paragraph. It is a
         fixed layer over an empty #root, painted before the bundle loads: by day the section yellow with the ink mark,
         in a dark set the night ground with the yellow mark, in Üveg and Klasszikus their quiet ground; nothing to read
         but one hidden word for a screen reader. Out of the page's flow, so taking it away moves nothing (the boot
         paragraph's 38vh margin was a layout shift of 0.24 to 0.38 on every load). lib/splash.ts fades it out once the
         first screen has painted. -->
    <style>
      #bt-splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#ffe500;color:#0a0a0a;transition:opacity .28s ease}
      html[data-scheme="dark"] #bt-splash{background:#0b0b0c;color:#ffe500}
      html[data-style]:not([data-style="pop"]) #bt-splash{background:#f6f6f4;color:#1d1d1b}
      html[data-style]:not([data-style="pop"])[data-scheme="dark"] #bt-splash{background:#151514;color:#ececea}
      #bt-splash.out{opacity:0;pointer-events:none}
      html[data-motion="reduce"] #bt-splash{transition:none}
      #bt-splash svg{width:72px;height:72px}
      #bt-splash span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    </style>
