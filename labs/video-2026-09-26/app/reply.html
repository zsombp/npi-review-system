<!-- the queue's one card (the lab's article.card.queue-detail), alone on a transparent page -->
<main class="main" id="main">
  <section class="view" data-view="valaszok" data-sec="rep">
    <article class="card queue-detail">
      <div class="q-top">
        <p class="q-pos"><span class="q-i" data-k="q.i">1</span><span class="q-of"> <span data-k="q.of">/ 6</span></span></p>
        <ol class="pips" aria-hidden="true"><li></li><li></li><li></li><li></li><li></li><li></li></ol>
        <span class="q-step">
          <span class="btn btn-2 btn-icon"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-up"/></svg></span>
          <span class="btn btn-2 btn-icon"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-down"/></svg></span>
        </span>
      </div>
      <div class="q-head"><h2 class="queue-title" data-k="q.venue">Példa Bisztró</h2><span class="stars" id="q-stars"></span></div>
      <p class="rv-meta q-meta-line"><span data-k="q.meta">Minta Katalin · tegnap 12:40 · magyar</span><span class="sep" aria-hidden="true"> · </span><span class="ext"><span data-k="q.google">Megnyitás a Google-on</span><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-ext"/></svg></span></p>
      <blockquote class="rv-text q-body" data-k="q.review">A leves langyos volt, és húsz percet vártunk a számlára.</blockquote>
      <span class="reply-label" data-k="q.label">A válasz</span>
      <div class="reply-box" id="reply-box"><span class="swap-bg"></span><span class="rb-text" id="rb-text"></span><span class="rb-text rb-alt" id="rb-alt"></span><span class="caret" id="caret"></span></div>
      <details class="rewrite" open>
        <summary><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-sliders"/></svg><span data-k="q.rewrite">Átírás</span><span class="rw-now" id="rw-now"></span></summary>
        <div class="chip-row rewrite-row" id="chips"></div>
      </details>
      <div class="q-actions">
        <span class="btn btn-go" id="approve"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-check"/></svg><span data-k="q.approve">Jóváhagyás</span><kbd aria-hidden="true">A</kbd></span>

      </div>
      <p class="v-stamp" id="stamp" data-k="q.stamp">Jóváhagyva</p>
      <span class="v-tap" id="tap"></span>
    </article>
  </section>

<script>
/* fillFrame(S): every [data-k] takes its words from the video's string table (a flat dictionary). */
window.fillFrame = function (S, build) {
  document.documentElement.lang = S.lang || "hu";
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"), function (el) {
    var k = el.getAttribute("data-k");
    if (S[k] != null) el.textContent = S[k];
  });
  if (build) build(document, S);
  return document.fonts.ready;
};
</script>
