<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 131" width="760" height="131" role="img" aria-labelledby="t">
<!-- BistroTech lockup: mark plus wordmark. v0.1.0, 2026-09-15.
     Self contained. The mark and the letterforms are copied in, not linked, so
     this file stands on its own. Clear space: keep the mark's own width free on
     every side. Minimum width in use: 160 px. Below that, use the mark alone.
     Light and dark: both parts switch under prefers-color-scheme. Override the
     bt-mark and bt-ink variables to place the lockup on a coloured ground. -->
<title id="t">BistroTech</title>
<style>
  .bt-mark { fill: var(--bt-mark, #0F4C81); }
  .bt-word { fill: none; stroke: var(--bt-ink, #1D1D1B); stroke-width: 12; stroke-linecap: butt; stroke-linejoin: round; }
  .bt-dot  { fill: var(--bt-ink, #1D1D1B); stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bt-mark { fill: var(--bt-mark, #8FBCEC); }
    .bt-word { stroke: var(--bt-ink, #ECECEA); }
    .bt-dot  { fill: var(--bt-ink, #ECECEA); }
  }
</style>
<g transform="translate(-8.1,-4.4) scale(6.2)">
  <path class="bt-mark" fill-rule="evenodd" d="
    M 4.01 13.41 A 8.5 8.5 0 1 1 6.31 16.82 L 2.6 20.4 Z
    M 7.2 14.6 V 11.8 A 1.2 1.2 0 0 1 9.6 11.8 V 14.6 Z
    M 10.8 14.6 V 9.8 A 1.2 1.2 0 0 1 13.2 9.8 V 14.6 Z
    M 14.4 14.6 V 7.8 A 1.2 1.2 0 0 1 16.8 7.8 V 14.6 Z
  "/>
</g>
<g transform="translate(154,15)">
  <g class="bt-word">
    <path transform="translate(0,0)"   d="M 6 6 V 94 M 6 6 H 30 A 22 22 0 0 1 30 50 H 6 M 6 50 H 30 A 22 22 0 0 1 30 94 H 6"/>
    <path transform="translate(66,0)"  d="M 7 34 V 94"/>
    <path transform="translate(88,0)"  d="M 44 47 C 44 37 35 34 25 34 C 15 34 6 37 6 47 C 6 57 16 60 25 64 C 34 68 44 71 44 81 C 44 91 35 94 25 94 C 15 94 6 91 6 81"/>
    <path transform="translate(146,0)" d="M 22 14 V 82 A 12 12 0 0 0 34 94 M 6 34 H 38"/>
    <path transform="translate(196,0)" d="M 6 94 V 52 A 18 18 0 0 1 24 34"/>
    <circle transform="translate(230,0)" cx="36" cy="64" r="30"/>
    <path transform="translate(306,0)" d="M 6 6 H 58 M 32 6 V 94"/>
    <path transform="translate(372,0)" d="M 6 64 H 66 A 30 30 0 1 0 60.6 81.2"/>
    <path transform="translate(452,0)" d="M 60.6 46.8 A 30 30 0 1 0 60.6 81.2"/>
    <path transform="translate(532,0)" d="M 6 6 V 94 M 6 61 A 27 27 0 0 1 60 61 V 94"/>
  </g>
  <circle class="bt-dot" cx="73" cy="16" r="7"/>
</g>
</svg>
